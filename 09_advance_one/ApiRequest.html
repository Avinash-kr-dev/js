<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* align-content: center; */
      }
    </style>
  </head>
  <body style="background-color: #212121">
    <div class="card">
      <div class="container">
        <img src="" alt="" height="400px" width="300px" />
        <h4 class="one">sh Choudhary</h4>
        <h4>Followers: <span class="followers"></span></h4>
      </div>
    </div>
  </body>

  <script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest()

    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function () {
      // console.log(xhr.readyState);
      if (xhr.readyState === 4) {
        const data = JSON.parse(this.responseText)
        document.querySelector('img').setAttribute('src', `${data.avatar_url}`)
        document.querySelector('.one').innerHTML = `${data.name}`
        document.querySelector('.followers').innerHTML = `${data.followers}`
      }
    }
    xhr.send()
  </script>
</html>
